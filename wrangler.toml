# wrangler.toml — Cloudflare Worker konfigürasyonu (drive-upload)
#
# Bu dosya rate limiting binding'i kayıt altına almak için eklendi
# (B4 deploy bloker, 2026-05-04). workers.dev üzerinde custom WAF rule
# yapılamadığı için Worker-native Rate Limiting API kullanılıyor.
#
# Mevcut deploy yöntemi (Cloudflare Dashboard → Edit code → Save and
# Deploy) korunuyor; binding manuel olarak Dashboard'dan da eklenebilir
# (Settings → Bindings → Rate Limiter). Bu dosya single source of truth.
#
# Wrangler CLI ile deploy isteniyorsa:
#   wrangler deploy
# (Önce: wrangler login + npm install -g wrangler)

name = "drive-upload"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"

# Rate limiting binding (B4)
# IP başına /misafirLogin için 5 req / 60s. PBKDF2 600k iter brute force
# DoS koruması — her istek Worker CPU 200-500ms tüketir.
#
# namespace_id Cloudflare hesabı içinde unique olmalı; ilk deploy'da
# Wrangler / Dashboard atar. Dashboard'dan elle eklenirken sayısal
# bir id seç (örn. 1001) ve aşağı yansıt.
[[unsafe.bindings]]
name = "MISAFIR_LOGIN_RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# /rapor rate limit binding (B18)
# Authenticated user başına 5 req / 60s. Gemini 2.5 Flash multimodal
# çağrısı paralı (~$0.001-0.005/req); ek olarak Drive API + KÖSTER web
# scraping CPU+bandwidth maliyeti. Spam = quota/cost exhaustion vektörü.
# Key: user.sub (auth payload'tan).
[[unsafe.bindings]]
name = "RAPOR_RL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Secret env var'ları wrangler.toml'a YAZILMAZ (gizli):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN,
#   DRIVE_KLASOR_ID, GEMINI_API_KEY, SUPABASE_URL, SUPABASE_ANON_KEY,
#   SUPABASE_JWT_SECRET, PII_PEPPER (M6), GUEST_PASSWORD_HASH (M7).
# Bunlar `wrangler secret put NAME` veya Dashboard → Variables →
# Encrypt ile eklenir (mevcut deploy süreci).
